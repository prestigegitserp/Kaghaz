name: Deploy Kaghaz versions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Validate Kaghaz]
    branches: [v2, v3, v4, v5, v6]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && 'github-pages-skipped' || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1
            # Root and /v1 both use the original, frozen source.
            ref: 25dc79f755cdd5f71b324f3f1705c67097421453
            base: './'
          - version: v2
            ref: v2
            base: /Kaghaz/v2/
          - version: v3
            ref: v3
            base: /Kaghaz/v3/
          - version: v4
            ref: v4
            base: /Kaghaz/v4/
          - version: v5
            ref: v5
            base: /Kaghaz/v5/
          - version: v6
            ref: v6
            base: /Kaghaz/v6/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PUBLIC_BASE: ${{ matrix.base }}
      - name: Record deployed source
        if: matrix.version != 'v1'
        run: git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kaghaz-pages-${{ matrix.version }}
          path: dist
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kaghaz-pages-*
          path: releases
      - name: Assemble the root and six version routes
        shell: bash
        run: |
          mkdir -p dist/v1 dist/v2 dist/v3 dist/v4 dist/v5 dist/v6
          cp -a releases/kaghaz-pages-v1/. dist/
          cp -a releases/kaghaz-pages-v1/. dist/v1/
          cp -a releases/kaghaz-pages-v2/. dist/v2/
          cp -a releases/kaghaz-pages-v3/. dist/v3/
          cp -a releases/kaghaz-pages-v4/. dist/v4/
          cp -a releases/kaghaz-pages-v5/. dist/v5/
          cp -a releases/kaghaz-pages-v6/. dist/v6/
          touch dist/.nojekyll
          test -f dist/index.html
          for version in v1 v2 v3 v4 v5 v6; do test -f "dist/$version/index.html"; done
          test -f dist/v2/v2/models/paper-ream.glb
          test -f dist/v3/v3/models/paper-ream-open.glb
          test -f dist/v3/v3/renders/market.webp
          test -f dist/v4/v4/renders/hall.webp
          test -f dist/v4/v4/models/paper-ream-modern.glb
          test -f dist/v5/v5/renders/passage.webp
          test -f dist/v5/v5/models/wrapped-stock-pallet.glb
          test -f dist/v6/v6/asset-manifest.json
          test -f dist/v6/v6/renders/passage.webp
          test -f dist/v6/v6/models/honeycomb.glb
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Kaghaz to github.io
        id: deployment
        uses: actions/deploy-pages@v5.0.1
