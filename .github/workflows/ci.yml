name: Validate Kaghaz
on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PUBLIC_BASE: /Kaghaz/v4/
      - run: npx playwright install chromium
      - run: node tests/v4-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaghaz-v4-browser
          path: qa
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kaghaz-v4-dist
          path: dist
